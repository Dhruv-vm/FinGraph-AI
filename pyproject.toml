[project]
name = "fingraph-ai"
version = "0.1.0"
description = "Temporal Knowledge Graph and RAG-based AI system for financial intelligence, analysis, and prediction."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "python-dotenv>=1.2.3",
    "yfinance>=1.6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
